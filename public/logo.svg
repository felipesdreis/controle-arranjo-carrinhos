<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fundo branco -->
  <rect width="200" height="200" fill="#ffffff"/>

  <!-- Alça arredondada no topo -->
  <path d="M75 30 V55" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M125 30 V55" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M75 30 Q75 20 85 20 L115 20 Q125 20 125 30" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Estrutura vertical principal (colunas) -->
  <rect x="72" y="55" width="6" height="110" rx="2" fill="#1a1a1a"/>
  <rect x="122" y="55" width="6" height="110" rx="2" fill="#1a1a1a"/>

  <!-- Prateleira superior -->
  <rect x="68" y="85" width="64" height="5" rx="2" fill="#1a1a1a"/>

  <!-- Folhetos amarelos na prateleira superior -->
  <rect x="78" y="62" width="10" height="22" rx="1" fill="#f5c542"/>
  <rect x="92" y="65" width="10" height="19" rx="1" fill="#f0b830"/>
  <rect x="106" y="60" width="10" height="24" rx="1" fill="#f5c542"/>

  <!-- Prateleira intermediária -->
  <rect x="68" y="115" width="64" height="5" rx="2" fill="#1a1a1a"/>

  <!-- Folhetos e revistas verticais em tons pastel na prateleira intermediária -->
  <rect x="76" y="90" width="9" height="24" rx="1" fill="#a8d8ea"/>
  <rect x="88" y="88" width="9" height="26" rx="1" fill="#f8b4c8"/>
  <rect x="100" y="92" width="9" height="22" rx="1" fill="#c3aed0"/>
  <rect x="112" y="89" width="9" height="25" rx="1" fill="#aed582"/>

  <!-- Prateleira inferior -->
  <rect x="68" y="145" width="64" height="5" rx="2" fill="#1a1a1a"/>

  <!-- Revistas ilustradas maiores na prateleira inferior -->
  <rect x="74" y="122" width="14" height="22" rx="1" fill="#f67018"/>
  <rect x="76" y="124" width="10" height="3" rx="0.5" fill="#ffffff" opacity="0.5"/>
  <rect x="76" y="128" width="8" height="2" rx="0.5" fill="#ffffff" opacity="0.3"/>

  <rect x="92" y="120" width="14" height="24" rx="1" fill="#c0392b"/>
  <rect x="94" y="122" width="10" height="3" rx="0.5" fill="#ffffff" opacity="0.5"/>
  <rect x="94" y="126" width="8" height="2" rx="0.5" fill="#ffffff" opacity="0.3"/>

  <rect x="110" y="123" width="14" height="21" rx="1" fill="#2e86de"/>
  <rect x="112" y="125" width="10" height="3" rx="0.5" fill="#ffffff" opacity="0.5"/>
  <rect x="112" y="129" width="8" height="2" rx="0.5" fill="#ffffff" opacity="0.3"/>

  <!-- Banner/panel lateral direito -->
  <rect x="132" y="60" width="38" height="95" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Texto em destaque no banner -->
  <rect x="138" y="70" width="26" height="4" rx="2" fill="#1a1a1a"/>
  <rect x="138" y="78" width="20" height="3" rx="1.5" fill="#555555"/>
  <rect x="138" y="84" width="22" height="3" rx="1.5" fill="#555555"/>
  <rect x="138" y="90" width="18" height="3" rx="1.5" fill="#555555"/>

  <!-- Rodapé azul do banner -->
  <rect x="132" y="140" width="38" height="12" rx="0 0 3 3" fill="#2e86de"/>
  <rect x="140" y="144" width="22" height="3" rx="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Base de apoio de metal -->
  <rect x="65" y="165" width="70" height="5" rx="2" fill="#555555"/>
  <rect x="70" y="170" width="4" height="10" rx="1" fill="#555555"/>
  <rect x="126" y="170" width="4" height="10" rx="1" fill="#555555"/>
</svg>
